function getPoints(q) {
  const s = String(q).toLowerCase();
  if (s.includes("e-cig") || s.includes("cigarette")) return 10;
  if (s.includes("roll") || s.includes("roulé")) return 1;
  if (s.includes("10g")) return 10;
  if (s.includes("7g")) return 7;
  if (s.includes("5g")) return 5;
  if (s.includes("3,5g") || s.includes("3.5g")) return 3;
  if (s.includes("3g")) return 3;
  if (s.includes("2,5g") || s.includes("2.5g")) return 2;
  if (s.includes("2g")) return 2;
  if (s.includes("1,5g") || s.includes("1.5g")) return 1;
  if (s.includes("1g")) return 1;
  if (s.includes("trim cbd")) return 10;
  if (s.includes("trim cbn")) return 10;
  return 1;
}

// Firebase sync helpers — sauvegarde réseau + 1 seul adhérent par email
function fbClean(data){
  const copy = {...(data || {})};
  delete copy._id;
  return copy;
}
function fbSafeId(v){
  return String(v || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"_").slice(0,120);
}
function fbUserKey(u){
  return String(u?.email || u?.prenom || u?._id || "").trim().toLowerCase();
}
function fbDedupeUsersList(list){
  const map = new Map();
  (list || []).forEach(u=>{
    const key = fbUserKey(u);
    if(!key) return;
    const old = map.get(key);
    if(!old){
      map.set(key, {...u, email:u.email ? String(u.email).trim().toLowerCase() : u.email});
    }else{
      map.set(key, {
        ...old, ...u,
        email:(u.email || old.email || "").toString().trim().toLowerCase(),
        points:Math.max(Number(old.points||0), Number(u.points||0)),
        historique:(old.historique && old.historique.length) ? old.historique : (u.historique || []),
        commandes:(old.commandes && old.commandes.length) ? old.commandes : (u.commandes || []),
        dateInscription:old.dateInscription || u.dateInscription
      });
    }
  });
  return Array.from(map.values());
}
function fbDocId(colName, data){
  if(colName === "users" && data?.email) return fbSafeId(data.email);
  if(data?._id) return data._id;
  if(colName === "codes" && data?.code) return fbSafeId(data.code);
  if(colName === "usedCodes" && data?.code) return fbSafeId(data.code);
  return null;
}
async function fbSave(colName, data) {
  try {
    if(!window._db || !window._fbModules) return;
    const {collection:col, addDoc, setDoc, doc} = window._fbModules;
    const db = window._db;
    const payload = {...fbClean(data), updatedAt:new Date().toISOString()};
    const id = fbDocId(colName, data);
    if(id){
      await setDoc(doc(db, colName, id), payload, {merge:true});
      data._id = id;
    }else{
      const ref = await addDoc(col(db, colName), {...payload, createdAt:new Date().toISOString()});
      data._id = ref.id;
    }
  } catch(e) { console.warn('fbSave error', e); }
}
async function fbUpdate(colName, data, patch) {
  try {
    if(!window._db || !window._fbModules) return;
    const {setDoc, doc} = window._fbModules;
    const db = window._db;
    const id = fbDocId(colName, data);
    if(!id) return fbSave(colName, {...data, ...patch});
    await setDoc(doc(db, colName, id), {...fbClean(patch), updatedAt:new Date().toISOString()}, {merge:true});
  } catch(e) { console.warn('fbUpdate error', e); }
}
async function fbDelete(colName, data) {
  try {
    if(!window._db || !window._fbModules) return;
    const {deleteDoc, doc} = window._fbModules;
    const db = window._db;
    const id = fbDocId(colName, data);
    if(id) await deleteDoc(doc(db, colName, id));
  } catch(e) { console.warn('fbDelete error', e); }
}
function fbSyncCollection(colName, targetArray){
  try {
    if(!window._db || !window._fbModules) return;
    const {collection:col, onSnapshot} = window._fbModules;
    const db = window._db;
    onSnapshot(col(db, colName), (snap)=>{
      const loaded = [];
      snap.forEach(d=>loaded.push({...d.data(), _id:d.id}));
      const finalData = colName === "users" ? fbDedupeUsersList(loaded) : loaded;
      targetArray.splice(0, targetArray.length, ...finalData);
      window.dispatchEvent(new Event('origincbd_update'));
    }, (e)=>console.warn('fbSync error '+colName, e));
  } catch(e) { console.warn('fbSync init error '+colName, e); }
}
function initFirebaseSync(){
  if(window._originFirebaseSyncStarted) return;
  if(!window._db || !window._fbModules) return;
  window._originFirebaseSyncStarted = true;
  fbSyncCollection('commandes', STORE.commandes);
  fbSyncCollection('users', STORE.users);
  fbSyncCollection('avis', STORE.avis);
  fbSyncCollection('demandesPro', STORE.demandesPro);
  fbSyncCollection('codes', STORE.codes);
  fbSyncCollection('usedCodes', STORE.usedCodes);
}
window.addEventListener('firebase_ready', initFirebaseSync);
if(window._dbReady) initFirebaseSync();

const THEMES = {
  green:  { nb:[20,80,28],   st:[180,230,185], sm:[10,160,20],  co:[80,200,90],   bg:"#020403", ref:[10,140,15]  },
  violet: { nb:[50,10,120],  st:[200,170,255], sm:[80,10,200],  co:[140,60,255],  bg:"#020208", ref:[60,10,180]  },
  gold:   { nb:[100,70,5],   st:[255,230,160], sm:[180,120,5],  co:[240,190,50],  bg:"#040300", ref:[160,100,5]  },
  red:    { nb:[120,10,10],  st:[255,180,180], sm:[180,10,10],  co:[230,50,40],   bg:"#040200", ref:[150,10,10]  },
  white:  { nb:[40,50,60],   st:[220,230,255], sm:[60,80,120],  co:[180,200,240], bg:"#020304", ref:[50,70,100]  },
};

function GalaxyBg({ theme="green" }) {
  const ref = useRef(null);
  const themeRef = useRef(theme);
  useEffect(() => { themeRef.current = theme; }, [theme]);

  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    const W = c.width = window.innerWidth;
    const H = c.height = window.innerHeight;
    const stars = Array.from({ length: 700 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < 0.04 ? Math.random()*1.6+0.9 : Math.random()*0.55+0.08,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.007 + 0.002,
      bright: Math.random() < 0.04,
      tinted: Math.random() < 0.3,
    }));
    const smoke = Array.from({ length: 18 }, (_, i) => ({
      x: W * (0.55 + Math.random()*0.5),
      y: H * (0.4 + Math.random()*0.45),
      r: Math.random()*120+80,
      vx: -(Math.random()*0.18+0.06),
      vy: -(Math.random()*0.08+0.02),
      alpha: Math.random()*0.07+0.04,
      phase: Math.random()*Math.PI*2,
    }));
    let t = 0, id;

    function draw() {
      t += 0.4;
      const P = THEMES[themeRef.current] || THEMES.green;
      const [nr,ng,nb] = P.nb;
      const [sr,sg,sb] = P.st;
      const [smr,smg,smb] = P.sm;
      const [cr,cg,cb] = P.co;
      const [rr,rg,rb] = P.ref;
      ctx.fillStyle = P.bg;
      ctx.fillRect(0, 0, W, H);
      const waterY = H * 0.78;
      const waterGrad = ctx.createLinearGradient(0, waterY, 0, H);
      waterGrad.addColorStop(0, `rgba(${rr},${rg},${rb},0)`);
      waterGrad.addColorStop(0.3, `rgba(${rr},${rg},${rb},0.18)`);
      waterGrad.addColorStop(0.7, `rgba(${rr},${rg},${rb},0.32)`);
      waterGrad.addColorStop(1, `rgba(${rr},${rg},${rb},0.12)`);
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, waterY, W, H - waterY);
      for (let i = 0; i < 12; i++) {
        const wy = waterY + (i / 12) * (H - waterY);
        const wave = Math.sin(t * 0.03 + i * 0.8) * 6;
        const lineAlpha = (0.04 - i * 0.003) * (i % 2 === 0 ? 1 : 0.4);
        if (lineAlpha <= 0) continue;
        ctx.strokeStyle = `rgba(${rr},${rg+20},${rb},${lineAlpha})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(0, wy + wave); ctx.lineTo(W, wy - wave); ctx.stroke();
      }
      const angle = 38 * Math.PI / 180;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const px = W * 0.52, py = H * 0.42;
      const len = Math.max(W, H) * 2.4;
      [
        { off:0,   hw:280, a:0.04  },
        { off:-20, hw:180, a:0.07  },
        { off:15,  hw:130, a:0.06  },
        { off:0,   hw:90,  a:0.10  },
        { off:-8,  hw:55,  a:0.13  },
        { off:4,   hw:30,  a:0.16  },
        { off:0,   hw:14,  a:0.20  }, // cœur brillant
        { off:0,   hw:5,   a:0.14  }, // filament central blanc
      ].forEach(({ off, hw, a }, li) => {
        const ox = sin * off, oy = -cos * off;
        const rr2 = li >= 6 ? cr : nr;
        const gg2 = li >= 6 ? cg : ng;
        const bb2 = li >= 6 ? cb : nb;
        const gP = ctx.createLinearGradient(
          px+ox+sin*hw, py+oy-cos*hw,
          px+ox-sin*hw, py+oy+cos*hw
        );
        gP.addColorStop(0,   "rgba(0,0,0,0)");
        gP.addColorStop(0.3, `rgba(${rr2},${gg2},${bb2},${a*0.35})`);
        gP.addColorStop(0.5, `rgba(${rr2},${gg2},${bb2},${a})`);
        gP.addColorStop(0.7, `rgba(${rr2},${gg2},${bb2},${a*0.35})`);
        gP.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = gP; ctx.fillRect(0,0,W,H);
      });
      [
        {tp:0.22,pp:10,  r:45,a:0.16},{tp:0.35,pp:-18,r:32,a:0.14},
        {tp:0.48,pp:6,   r:55,a:0.18},{tp:0.56,pp:-10,r:28,a:0.13},
        {tp:0.65,pp:20,  r:38,a:0.12},{tp:0.76,pp:-4, r:22,a:0.14},
        {tp:0.28,pp:-28, r:20,a:0.10},{tp:0.70,pp:28, r:30,a:0.11},
      ].forEach(({tp,pp,r,a})=>{
        const along = tp - 0.5;
        const cx2 = px + cos*along*len*0.85 + sin*pp;
        const cy2 = py + sin*along*len*0.85 - cos*pp;
        const sc = (W/380);
        const ng2 = ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,r*sc);
        ng2.addColorStop(0,   `rgba(${cr},${cg},${cb},${a})`);
        ng2.addColorStop(0.4, `rgba(${nr},${ng},${nb},${a*0.5})`);
        ng2.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = ng2; ctx.fillRect(0,0,W,H);
      });
      smoke.forEach(s => {
        s.x += s.vx; s.y += s.vy;
        if (s.x < -s.r) { s.x = W + s.r; s.y = H*(0.4+Math.random()*0.45); }
        if (s.y < -s.r) { s.y = H + s.r; }
        const pulse = 0.7 + 0.3*Math.sin(t*0.015 + s.phase);
        const sg2 = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*pulse);
        sg2.addColorStop(0,   `rgba(${smr},${smg},${smb},${s.alpha})`);
        sg2.addColorStop(0.5, `rgba(${smr},${smg},${smb},${s.alpha*0.4})`);
        sg2.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = sg2; ctx.fillRect(0,0,W,H);
      });
      const sg3 = ctx.createRadialGradient(W*0.08,H*0.88,0,W*0.08,H*0.88,W*0.22);
      sg3.addColorStop(0,   `rgba(${smr},${smg},${smb},0.10)`);
      sg3.addColorStop(0.5, `rgba(${smr},${smg},${smb},0.04)`);
      sg3.addColorStop(1,   "rgba(0,0,0,0)");
      ctx.fillStyle = sg3; ctx.fillRect(0,0,W,H);
      stars.forEach(s => {
        const al = (Math.sin(s.phase + t*s.speed)+1)/2;
        const alpha = s.bright ? 0.5+al*0.5 : 0.12+al*0.7;
        const er = s.tinted ? sr : 210;
        const eg = s.tinted ? sg : 225;
        const eb = s.tinted ? sb : 245;

        if (s.bright) {
          const hg = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
          hg.addColorStop(0, `rgba(${er},${eg},${eb},${al*0.4})`);
          hg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = hg;
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2); ctx.fill();
          const rl = s.r*7;
          ctx.strokeStyle = `rgba(${er},${eg},${eb},${al*0.22})`;
          ctx.lineWidth = 0.4;
          ctx.beginPath(); ctx.moveTo(s.x-rl,s.y); ctx.lineTo(s.x+rl,s.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(s.x,s.y-rl); ctx.lineTo(s.x,s.y+rl); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(${er},${eg},${eb},${alpha})`; ctx.fill();
      });

      id = requestAnimationFrame(draw);
    }

    draw();
    return () => cancelAnimationFrame(id);
  }, []);

  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,width:"100vw",height:"100vh",pointerEvents:"none"}}/>;
}

function Welcome({onUser,onGuest,onManager,store}){
  const saved = (() => { try { return JSON.parse(localStorage.getItem("origincbd_user")||"{}"); } catch(e){return {};} })();
  const [prenom,setPrenom]=useState(saved.prenom||"");
  const [email,setEmail]=useState(saved.email||"");
  const [cp,setCp]=useState(saved.cp||"");
  const [mgCode,setMgCode]=useState(""); const [showMg,setShowMg]=useState(false);
  const [err,setErr]=useState(""); const [mgErr,setMgErr]=useState("");
  const isNew = !saved.prenom;
  function go(){
    if(!prenom.trim()||!email.trim()){setErr("Prénom et email obligatoires.");return;}
    if(!email.includes("@")){setErr("Email invalide.");return;}
    if(cp&&!/^\d{5}$/.test(cp.trim())){setErr("Code postal invalide (5 chiffres).");return;}
    const emailClean = email.trim().toLowerCase();
    let u=store.users.find(x=>String(x.email||"").trim().toLowerCase()===emailClean);
    const profil={prenom:prenom.trim(),email:emailClean,cp:cp.trim(),points:u?.points||0,historique:u?.historique||[],commandes:u?.commandes||[],dateInscription:u?.dateInscription||new Date().toLocaleDateString("fr-FR")};
    if(!u){store.users.push(profil);u=profil;}
    else{Object.assign(u,profil);}
    fbSave("users",profil);
    try{localStorage.setItem("origincbd_user",JSON.stringify({prenom:prenom.trim(),email:emailClean,cp:cp.trim()}));}catch(e){}
    onUser(u);
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <h1 style={{fontFamily:"Georgia,serif",fontSize:44,color:GOLD,fontWeight:600,letterSpacing:2,marginBottom:4}}>Origin CBD</h1>
        <p style={{color:"#a0a0a0",fontSize:12,letterSpacing:3}}>— L'origine du bien-être —</p>
      </div>
      <Card style={{width:"100%",maxWidth:400}}>
        <h2 style={{fontSize:17,fontWeight:600,color:"#e8e4dc",marginBottom:16,textAlign:"center"}}>{isNew?"Créer mon compte":"Bon retour 👋"}</h2>
        <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>PRÉNOM *</p>
        <input placeholder="Votre prénom" value={prenom} onChange={e=>{setPrenom(e.target.value);setErr("");}} style={{...IS,marginBottom:10}}/>
        <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>EMAIL *</p>
        <input placeholder="Votre adresse email" type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} style={{...IS,marginBottom:10}}/>
        <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>CODE POSTAL</p>
        <input placeholder="Ex : 69001" type="tel" maxLength={5} value={cp} onChange={e=>{setCp(e.target.value.replace(/[^0-9]/g,"").slice(0,5));setErr("");}} style={{...IS,marginBottom:err?8:14}}/>
        {err&&<p style={{color:"#f87171",fontSize:13,marginBottom:10}}>{err}</p>}
        <button onClick={go} style={BTN_GOLD}>Accéder au catalogue →</button>
        <div style={{textAlign:"center",margin:"12px 0",color:"#8a8a8a",fontSize:13}}>— ou —</div>
        <button onClick={onGuest} style={BTN_GHOST}>Parcourir sans compte</button>
        <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",marginTop:18,paddingTop:14}}>
          <button onClick={()=>setShowMg(!showMg)} style={{background:"none",border:"none",color:"#909090",fontSize:11,letterSpacing:1,cursor:"pointer"}}>🔐 Accès gérant</button>
          {showMg&&<>
            <input placeholder="Code gérant" type="password" value={mgCode} onChange={e=>{setMgCode(e.target.value);setMgErr("");}} onKeyDown={e=>e.key==="Enter"&&(mgCode==="35353010"?onManager():setMgErr("Code incorrect"))} style={{...IS,marginTop:10,marginBottom:mgErr?6:10,textAlign:"center",letterSpacing:6,fontSize:20}}/>
            {mgErr&&<p style={{color:"#f87171",fontSize:13,marginBottom:8}}>{mgErr}</p>}
            <button onClick={()=>mgCode==="35353010"?onManager():setMgErr("Code incorrect")} style={BTN_GOLD}>Valider</button>
          </>}
        </div>
      </Card>
    </div>
  );
}

function AvisForm({store, user}){
  const [open,setOpen]=useState(false);
  const [ok,setOk]=useState(false);
  const [note,setNote]=useState(5);
  const [auteur,setAuteur]=useState(user?.prenom||"");
  const [texte,setTexte]=useState("");
  const [produit,setProduit]=useState("");
  const [err,setErr]=useState("");

  function resetForm(){
    setTexte("");
    setProduit("");
    setNote(5);
    setErr("");
  }

  async function submit(e){
    if(e && e.preventDefault) e.preventDefault();
    if(!auteur.trim()||!texte.trim()){setErr("Nom et commentaire obligatoires.");return;}
    if(texte.trim().length<10){setErr("Commentaire trop court (10 caractères min).");return;}

    const avis={
      _id:"avis_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
      auteur:auteur.trim(),
      note:Number(note)||5,
      texte:texte.trim(),
      produit:produit.trim(),
      date:new Date().toLocaleDateString("fr-FR"),
      statut:"attente"
    };

    // Ajout local immédiat seulement si pas déjà présent
    if(!store.avis.some(a=>a._id===avis._id)) store.avis.push(avis);
    window.dispatchEvent(new Event('origincbd_update'));

    // Sauvegarde Firebase avec ID fixe pour éviter les doublons et permettre validation/suppression
    fbSave("avis", avis);

    // Email notification, sans bloquer le bouton si EmailJS échoue
    sendOriginEmail("⭐ Nouvel avis — "+avis.auteur+" ("+avis.note+"/5)",
      "NOUVEL AVIS CLIENT\n\nAuteur : "+avis.auteur+"\nNote : "+avis.note+"/5\nProduit : "+(avis.produit||"—")+"\nAvis : "+avis.texte+"\nDate : "+avis.date);

    setOk(true);
    setOpen(false);
    resetForm();
    setTimeout(()=>setOk(false),3500);
  }

  return(
    <div style={{margin:"14px 0 0",background:"linear-gradient(135deg,rgba(201,168,76,0.08),rgba(160,120,20,0.05))",border:`1px solid ${BORDER}`,borderRadius:14,overflow:"hidden"}}>
      {ok&&<div style={{margin:"12px 12px 0",background:"rgba(74,180,80,0.12)",border:"1px solid rgba(74,180,80,0.35)",borderRadius:10,padding:"10px 12px",color:"#5aba60",fontSize:12,fontWeight:700}}>✅ Avis envoyé. Il apparaîtra après validation.</div>}
      <button type="button" onClick={()=>setOpen(o=>!o)} style={{width:"100%",background:"none",border:"none",padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left"}}>
        <span style={{fontSize:22}}>⭐</span>
        <div style={{flex:1}}>
          <p style={{color:"#e8e4dc",fontWeight:700,fontSize:13}}>Laisser un avis</p>
          <p style={{color:"#909090",fontSize:11,marginTop:1}}>Partagez votre expérience Origin CBD</p>
        </div>
        <span style={{color:open?GOLD:"#555",fontSize:16}}>{open?"∧":"›"}</span>
      </button>

      {open&&(
        <div style={{padding:"0 16px 16px"}}>
          <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:8}}>VOTRE NOTE</p>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {[1,2,3,4,5].map(n=>(
              <button type="button" key={n} onClick={()=>setNote(n)} style={{
                background:"none",border:"none",cursor:"pointer",
                fontSize:32,opacity:n<=note?1:0.25,
                filter:n<=note?"drop-shadow(0 0 4px #fbbf24)":"none",
                transition:"all 0.15s",padding:0,
              }}>⭐</button>

            <span style={{color:GOLD,fontWeight:700,fontSize:14,alignSelf:"center",marginLeft:4}}>{note}/5</span>
          </div>
          <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>VOTRE NOM *</p>
          <input placeholder="Prénom ou pseudo" value={auteur} onChange={e=>{setAuteur(e.target.value);setErr("");}}
            style={{...IS,marginBottom:10,fontSize:13}}/>
          <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>PRODUIT ACHETÉ (optionnel)</p>
          <input placeholder="Ex: Gold Résine 3g, Trim CBN+..." value={produit} onChange={e=>setProduit(e.target.value)}
            style={{...IS,marginBottom:10,fontSize:13}}/>
          <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>VOTRE AVIS *</p>
          <textarea placeholder="Partagez votre expérience (qualité, livraison, service...)" value={texte}
            onChange={e=>{setTexte(e.target.value);setErr("");}}

          {err&&<p style={{color:"#f87171",fontSize:12,marginBottom:10}}>{err}</p>}

function CommandeForm({cart, total, user, onDone, store, forceUpdate}){
  const [open,setOpen]=useState(false);
  const [ok,setOk]=useState(false);
  const [prenom,setPrenom]=useState(user?.prenom||"");
  const [tel,setTel]=useState("");
  const [note,setNote]=useState("");
  const [err,setErr]=useState("");

  function submit(){
    if(!prenom.trim()||!tel.trim()){setErr("Prénom et téléphone obligatoires.");return;}
    const lignes = cart.map(it=>`${it.label} — ${it.format.q} ×${it.qte} = ${it.format.p*it.qte}€`).join(" | ");
    const commande={
      prenom:prenom.trim(), tel, note,
      total:total+"€", detail:lignes,
      date:new Date().toLocaleDateString("fr-FR"),
      statut:"nouvelle",
    };
    store.commandes.push(commande);
    fbSave("commandes", commande);
    sendOriginEmail("🛒 Nouvelle commande — "+commande.prenom+" — "+commande.total,
      "NOUVELLE COMMANDE\n\nClient : "+commande.prenom+"\nTél : "+commande.tel+"\nTotal : "+commande.total+"\nDétail : "+commande.detail+"\nNote : "+(commande.note||"—")+"\nDate : "+commande.date);
    if(forceUpdate) forceUpdate();
    setOk(true); setErr("");
  }

  if(ok) return(
    <div style={{marginTop:14,background:"rgba(74,180,80,0.1)",border:"1px solid rgba(74,180,80,0.3)",borderRadius:12,padding:"18px",textAlign:"center"}}>
      <div style={{fontSize:36,marginBottom:8}}>✅</div>
      <p style={{color:"#5aba60",fontWeight:700,fontSize:15,marginBottom:4}}>Commande envoyée !</p>
      <p style={{color:"#a0a0a0",fontSize:12,lineHeight:1.6}}>Nous vous contactons sous 24h.<br/>origincbd1900@gmail.com</p>
      <button onClick={()=>{setOk(false);setOpen(false);onDone();}} style={{...BTN_GREEN,marginTop:14,fontSize:13}}>Fermer</button>
    </div>
  );

  if(!open) return(
    <button onClick={()=>setOpen(true)} style={{...BTN_GOLD,marginTop:14}}>
      Passer commande →
    </button>
  );

  return(
    <div style={{marginTop:14,borderTop:`1px solid ${BORDER}`,paddingTop:14}}>
      <p style={{color:GOLD,fontWeight:700,fontSize:13,marginBottom:12}}>📋 Vos coordonnées</p>
      <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>PRÉNOM / NOM *</p>
      <input placeholder="Votre prénom et nom" value={prenom} onChange={e=>{setPrenom(e.target.value);setErr("");}}
        style={{...IS,marginBottom:10,fontSize:13}}/>
      <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>TÉLÉPHONE *</p>
      <input placeholder="06 xx xx xx xx" type="tel" value={tel} onChange={e=>{setTel(e.target.value);setErr("");}}
        style={{...IS,marginBottom:10,fontSize:13}}/>
      <p style={{color:"#909090",fontSize:10,letterSpacing:1,marginBottom:4}}>NOTE (optionnel)</p>
      <input placeholder="Remarque, adresse de livraison..." value={note} onChange={e=>setNote(e.target.value)}
        style={{...IS,marginBottom:14,fontSize:13}}/>
      {err&&<p style={{color:"#f87171",fontSize:12,marginBottom:10}}>{err}</p>}

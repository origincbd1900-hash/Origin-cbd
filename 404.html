<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Origin CBD</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08080a;
      color: #e8e4dc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .emoji { font-size: 64px; margin-bottom: 20px; }
    h1 {
      font-family: Georgia, serif;
      font-size: 38px;
      color: #c9a84c;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .tagline {
      color: #a0a0a0;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
    }
    .code {
      font-size: 72px;
      font-weight: 700;
      color: rgba(201,168,76,0.15);
      letter-spacing: 8px;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      color: #e8e4dc;
      margin-bottom: 10px;
    }
    p {
      color: #909090;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a {
      display: block;
      background: linear-gradient(135deg, #c9a84c, #e8c96a);
      color: #08080a;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    a:hover { opacity: 0.9; }
    .siren {
      color: #444;
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="emoji">🌿</div>
  <h1>Origin CBD</h1>
  <p class="tagline">— L'origine du bien-être —</p>
  <div class="card">
    <div class="code">404</div>
    <h2>Page introuvable</h2>
    <p>Cette page n'existe pas ou a été déplacée. Retournez à l'accueil pour consulter notre catalogue.</p>
    <a href="/">← Retour à l'accueil</a>
  </div>
  <p class="siren">SAS Origin CBD · SIREN 105 267 116 · THC &lt; 0,3%</p>
</body>
</html>
